name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # Install the package the way users will, outside the repo, and drive it with a fake claude.
      - name: Pack and install
        shell: bash
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/pkg" && cd "$RUNNER_TEMP/pkg"
          npm init -y > /dev/null
          npm install "$RUNNER_TEMP"/orchia-*.tgz
      - name: Smoke test
        shell: bash
        run: node scripts/smoke.mjs "$RUNNER_TEMP/pkg/node_modules/orchia/bin/orchia.mjs"
