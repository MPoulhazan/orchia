name: Bug report
description: Something doesn't work as described
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got. Screenshots help.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: Windows 11, macOS 15, Ubuntu 24.04…
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Node and Claude Code versions
      description: Output of `node -v` and `claude --version`
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Server output
      description: Anything printed by `npm start` around the problem
      render: text
