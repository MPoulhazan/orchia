<title>AgentHub Établi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400..800&family=Atkinson+Hyperlegible+Mono:wght@400..700&display=swap">
<style>
/* Layout: screen picker on top, one fixed 1360x840 app frame scaled to fit, design notes underneath. */
:root{
  --pg-bg:#F2F3F5; --pg-card:#FFFFFF; --pg-ink:#15181C; --pg-muted:#5B636D; --pg-rule:#D8DCE1; --pg-accent:#2446C7;
  --pg-font:'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif;
  --pg-mono:'Atkinson Hyperlegible Mono', ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --pg-bg:#101215; --pg-card:#181B1F; --pg-ink:#E6E8EB; --pg-muted:#98A0AA; --pg-rule:#2A2E34; --pg-accent:#93A6FF; color-scheme:dark; }
}
:root[data-theme="dark"]{ --pg-bg:#101215; --pg-card:#181B1F; --pg-ink:#E6E8EB; --pg-muted:#98A0AA; --pg-rule:#2A2E34; --pg-accent:#93A6FF; color-scheme:dark; }

*{box-sizing:border-box}
body{background:var(--pg-bg);color:var(--pg-ink);font:15px/1.55 var(--pg-font);padding:0 20px}
.page{max-width:1400px;margin:0 auto;padding-block:26px 56px;display:flex;flex-direction:column;gap:18px}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:14px}
.head h1{margin:0;font-size:26px;letter-spacing:-.01em}
.head p{margin:2px 0 0;color:var(--pg-muted);max-width:70ch}
.picker{display:flex;flex-wrap:wrap;gap:6px}
.picker button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:6px;border:1px solid var(--pg-rule);background:var(--pg-card);font-size:14px;font-weight:600;color:var(--pg-muted)}
.picker button span{font:500 11.5px var(--pg-mono);opacity:.7}
.picker button[aria-selected="true"]{background:var(--pg-ink);color:var(--pg-bg);border-color:var(--pg-ink)}
.picker button:focus-visible,.seg button:focus-visible,.nav button:focus-visible{outline:2px solid var(--pg-accent);outline-offset:2px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.bar h2{margin:0;font-size:19px}
.bar .r{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--pg-rule);border-radius:6px;overflow:hidden;background:var(--pg-card)}
.seg button{all:unset;cursor:pointer;padding:5px 12px;font-size:13px;color:var(--pg-muted)}
.seg button[aria-pressed="true"]{background:var(--pg-ink);color:var(--pg-bg)}
.nav{display:flex;gap:4px}
.nav button{all:unset;cursor:pointer;width:32px;height:30px;display:grid;place-items:center;border:1px solid var(--pg-rule);border-radius:6px;background:var(--pg-card);color:var(--pg-ink)}
.count{font:13px var(--pg-mono);color:var(--pg-muted)}
.stage{position:relative;overflow:hidden;border-radius:10px;border:1px solid var(--pg-rule);box-shadow:0 18px 50px -26px rgba(10,20,40,.35)}
.stage > .app{position:absolute;left:0;top:0;transform-origin:0 0}
.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px 28px}
.notes div{display:flex;flex-direction:column;gap:2px}
.notes b{font-size:14.5px}
.notes p{margin:0;color:var(--pg-muted);font-size:14px;max-width:62ch}
.mock{font:600 11px var(--pg-mono);color:var(--pg-accent);letter-spacing:.04em;text-transform:uppercase}

/* ================= APP · Établi ================= */
.app{
  --desk:#E9ECEF; --panel:#FFFFFF; --ink:#111418; --ink2:#535C66; --ink3:#87909A; --rule:#D9DDE2; --rule2:#C6CCD3; --hover:#F1F3F5; --sel:#E6EBF8;
  --acc:#2446C7; --hl:#FFE24D; --hl-soft:#FFF6C2; --hl-edge:#E2BE00; --hl-ink:#3A3000; --work:#18865A; --err:#C2362F; --idle:#B5BCC4; --scrim:rgba(17,20,24,.28);
  --shadow:0 24px 60px -18px rgba(17,20,24,.35);
  --t-bg:#FFFFFF; --t-fg:#1A1E23; --t-dim:#7E8792; --t-add:#106A45; --t-add-bg:#E3F4EB; --t-del:#A92F28; --t-del-bg:#FCE8E6; --t-acc:#2446C7; --t-rule:#D2D7DD; --t-sel:#2446C7; --t-user-bg:#F0F2F5; --t-warn:#8A6A00;
  width:1360px;height:840px;display:flex;overflow:hidden;position:relative;text-align:left;
  font:13.5px/1.45 'Atkinson Hyperlegible Next', system-ui, sans-serif; color:var(--ink); background:var(--desk);
}
.app[data-mt="dark"]{
  --desk:#0E1114; --panel:#161A1E; --ink:#E8EBEE; --ink2:#9AA3AE; --ink3:#66707B; --rule:#252B32; --rule2:#333B44; --hover:#1C2127; --sel:#1C2540;
  --acc:#8DA2FF; --hl:#E9CD33; --hl-soft:#2E2A12; --hl-edge:#8C7A1C; --hl-ink:#1D1800; --work:#4FC58E; --err:#F07B72; --idle:#3B434C; --scrim:rgba(0,0,0,.55);
  --shadow:0 24px 60px -18px rgba(0,0,0,.7);
  --t-bg:#161A1E; --t-fg:#DCE1E6; --t-dim:#6E7884; --t-add:#7FD7AD; --t-add-bg:#16302A; --t-del:#F2A097; --t-del-bg:#3A1E1D; --t-acc:#8DA2FF; --t-rule:#2A3139; --t-sel:#8DA2FF; --t-user-bg:#1C2127; --t-warn:#E9CD33;
}
.app *{box-sizing:border-box}
.app .mono{font-family:'Atkinson Hyperlegible Mono',ui-monospace,monospace}
.ic{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sp{flex:1}
kbd.k{font:500 11px 'Atkinson Hyperlegible Mono',monospace;color:var(--ink2);border:1px solid var(--rule2);border-bottom-width:2px;border-radius:4px;padding:0 5px;line-height:16px}
.btn{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:5px;font-weight:700;font-size:12.5px;border:1px solid var(--rule2);background:var(--panel);color:var(--ink);white-space:nowrap}
.btn.pri{background:var(--ink);border-color:var(--ink);color:var(--panel)}
.btn.lg{height:34px;padding:0 14px;font-size:14px;border-radius:6px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink2)}
.ib{display:grid;place-items:center;width:28px;height:28px;border-radius:5px;color:var(--ink2)}
.ib.on{background:var(--panel);color:var(--ink);box-shadow:0 0 0 1px var(--rule)}

.dot{width:8px;height:8px;border-radius:50%;background:var(--idle);flex:none}
.dot.w{background:var(--work);box-shadow:0 0 0 3px color-mix(in srgb,var(--work) 18%,transparent)}
.dot.a{background:var(--hl);box-shadow:inset 0 0 0 1.5px var(--hl-edge)}
.dot.d{background:var(--acc)}
.dot.p{background:transparent;box-shadow:inset 0 0 0 1.5px var(--ink3)}
.dot.x{background:var(--rule2)}
@media (prefers-reduced-motion:no-preference){ .dot.w{animation:breathe 1.8s ease-in-out infinite} @keyframes breathe{50%{opacity:.45}} }
.mark{background:linear-gradient(transparent 10%,var(--hl) 10%,var(--hl) 90%,transparent 90%);color:var(--hl-ink);padding:0 4px;font-weight:800;font-size:11px;letter-spacing:.03em;border-radius:1px;white-space:nowrap}
.mark.done{background:linear-gradient(transparent 10%,color-mix(in srgb,var(--acc) 20%,transparent) 10%,color-mix(in srgb,var(--acc) 20%,transparent) 90%,transparent 90%);color:var(--acc)}
.sw{font-size:12px;font-weight:700;white-space:nowrap}
.sw.w{color:var(--work)} .sw.d{color:var(--acc)} .sw.i,.sw.p,.sw.x{color:var(--ink3);font-weight:600}

/* sidebar */
.side{width:288px;flex:none;display:flex;flex-direction:column;gap:2px;padding:14px 12px 10px;border-right:1px solid var(--rule)}
.brand{display:flex;align-items:center;gap:8px;padding:0 4px 12px;font-weight:800;font-size:15px}
.glyph{display:grid;grid-template-columns:1fr 1fr;gap:2px;width:16px;height:16px;flex:none}
.glyph i{background:var(--ink);border-radius:1px} .glyph i:nth-child(2){background:var(--hl)}
.brand .vs{display:flex;gap:2px;padding:2px;border-radius:6px;background:color-mix(in srgb,var(--ink) 6%,transparent)}
.brand .vs .ib{width:26px;height:24px}
.search{display:flex;align-items:center;gap:8px;height:34px;padding:0 10px;border-radius:6px;background:var(--panel);border:1px solid var(--rule);color:var(--ink3);margin-bottom:10px}
.search span{flex:1}
.sec{display:flex;align-items:center;gap:8px;padding:8px 6px 6px;font-size:12px;font-weight:800;color:var(--ink2)}
.sec .n{background:var(--hl);color:var(--hl-ink);padding:0 6px;border-radius:2px;font-weight:800}
.sec .ib{width:22px;height:22px}
.inbox{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.msg{display:flex;flex-direction:column;gap:4px;padding:9px 10px;border-radius:7px;background:var(--panel);border:1px solid var(--rule)}
.msg.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.msg .who{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2);min-width:0}
.msg .who b{color:var(--ink);white-space:nowrap}
.msg .who .pj{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg .who time{margin-left:auto;font:11.5px 'Atkinson Hyperlegible Mono',monospace;color:var(--ink3);flex:none}
.msg p{margin:0;font-size:13px;line-height:1.38}
.msg code{font:12.5px 'Atkinson Hyperlegible Mono',monospace;background:var(--hover);padding:0 4px;border-radius:3px}
.msg .acts{display:flex;gap:6px;margin-top:3px}
.proj{display:flex;align-items:center;gap:6px;padding:7px 6px 3px;font-weight:800}
.proj .ic{color:var(--ink3)}
.proj small{margin-left:auto;color:var(--ink3);font-weight:400;font-size:12px}
.sess{display:flex;align-items:center;gap:8px;height:28px;padding:0 8px 0 26px;border-radius:5px;color:var(--ink2)}
.sess.on{background:var(--sel);color:var(--ink);font-weight:800}
.sess .ic{color:var(--ink3);width:13px;height:13px}
.sess .t{margin-left:auto;font:11.5px 'Atkinson Hyperlegible Mono',monospace;color:var(--ink3);font-weight:400}
.empty-tree{margin:4px 6px;padding:12px;border:1px dashed var(--rule2);border-radius:7px;color:var(--ink2);font-size:13px}
.side-foot{margin-top:auto;display:flex;align-items:center;gap:6px;color:var(--ink3);padding:8px 2px 0}
.side-foot .tm{display:flex;gap:2px;padding:2px;border-radius:6px;background:color-mix(in srgb,var(--ink) 6%,transparent)}
.side-foot .tm .ib{width:26px;height:24px}

/* rail (collapsed sidebar) */
.rail{width:60px;flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 0 10px;border-right:1px solid var(--rule)}
.rail .glyph{margin-bottom:10px}
.rail .badge{position:relative}
.rail .badge b{position:absolute;top:-2px;right:-6px;background:var(--hl);color:var(--hl-ink);font-size:10.5px;font-weight:800;padding:0 4px;border-radius:2px;line-height:15px}
.rail hr{width:28px;border:0;border-top:1px solid var(--rule);margin:6px 0}
.rs{position:relative;width:38px;height:34px;border-radius:6px;display:grid;place-items:center;font:700 11.5px 'Atkinson Hyperlegible Mono',monospace;color:var(--ink2)}
.rs.on{background:var(--panel);color:var(--ink);box-shadow:0 0 0 1px var(--rule)}
.rs .dot{position:absolute;top:4px;right:4px;width:7px;height:7px}

/* focus main */
.main{flex:1;display:flex;flex-direction:column;min-width:0;padding-block:10px}
.tabs{display:flex;align-items:end;gap:2px;padding:0 12px;height:38px}
.tab{display:flex;align-items:center;gap:8px;height:34px;padding:0 14px;border-radius:7px 7px 0 0;color:var(--ink2);font-size:13px}
.tab.on{background:var(--panel);color:var(--ink);font-weight:800;box-shadow:0 -1px 0 var(--rule),1px 0 0 var(--rule),-1px 0 0 var(--rule)}
.tab .x{color:var(--ink3);display:grid}
.tab.add{padding:0 10px;color:var(--ink3)}
.card{flex:1;display:flex;flex-direction:column;margin-left:12px;background:var(--panel);border:1px solid var(--rule);border-radius:0 8px 8px 8px;min-height:0;overflow:hidden;position:relative}
.card.solo{border-radius:8px}
.cbar{display:flex;align-items:center;gap:10px;height:46px;padding:0 10px 0 16px;border-bottom:1px solid var(--rule)}
.cbar .path{font:12px 'Atkinson Hyperlegible Mono',monospace;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border:1px solid var(--rule);border-radius:6px;font-size:12.5px;white-space:nowrap}
.chip .k{color:var(--ink3)}
.chip.open{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.cbar .acts{display:flex;gap:2px}
.term{margin:0;white-space:pre;overflow:hidden;font-variant-ligatures:none;background:var(--t-bg);color:var(--t-fg)}
.card .term{flex:1;padding:16px 20px;font:13px/1.65 'Atkinson Hyperlegible Mono',monospace}
.term b{font-weight:700}
.term .t-dim{color:var(--t-dim)} .term .t-add{color:var(--t-add);background:var(--t-add-bg)} .term .t-del{color:var(--t-del);background:var(--t-del-bg)}
.term .t-acc{color:var(--t-acc)} .term .t-user{background:var(--t-user-bg)} .term .t-sel{color:var(--t-sel);font-weight:700} .term .t-warn{color:var(--t-warn)}
.term .t-box{display:block;border-top:1px solid var(--t-rule);padding-top:6px;margin-top:4px}
.term .cur{display:inline-block;width:.6em;height:1.15em;vertical-align:-.2em;background:var(--t-fg);opacity:.8}
.term.dim{opacity:.55}
.endbar{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--rule);background:var(--hover)}
.endbar .txt{display:flex;flex-direction:column;line-height:1.35}
.endbar .txt b{font-size:14px}
.endbar .txt span{color:var(--ink2);font-size:12.5px}

/* inspector */
.insp{width:296px;flex:none;display:flex;flex-direction:column;gap:18px;padding:16px 16px 16px 14px;overflow:hidden}
.insp-h{display:flex;align-items:center;justify-content:space-between;font-weight:800;font-size:13px}
.insp-h .k{font-weight:400}
.blk{display:flex;flex-direction:column;gap:8px}
.blk h5{margin:0;display:flex;justify-content:space-between;font-size:12px;font-weight:800;color:var(--ink2)}
.blk h5 span{font-weight:400;color:var(--ink3);font-family:'Atkinson Hyperlegible Mono',monospace}
.meter{height:8px;border-radius:4px;background:var(--rule);overflow:hidden;display:flex}
.meter i{display:block;height:100%}
.legend{display:flex;gap:12px;font-size:11.5px;color:var(--ink2)}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:13px;margin:0}
.kv dt{color:var(--ink2)} .kv dd{margin:0;font-family:'Atkinson Hyperlegible Mono',monospace;font-variant-numeric:tabular-nums;text-align:right}
.todo{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none;font-size:13px}
.todo li{display:flex;gap:8px;align-items:flex-start;line-height:1.35}
.todo .bx{flex:none;width:15px;height:15px;margin-top:1px;border-radius:3px;border:1.5px solid var(--ink3);display:grid;place-items:center}
.todo .bx .ic{width:11px;height:11px;stroke-width:3}
.todo li.ok{color:var(--ink3)} .todo li.ok .bx{background:var(--work);border-color:var(--work);color:var(--panel)}
.todo li.now{font-weight:800} .todo li.now .bx{border-color:var(--hl-edge);background:var(--hl)}
.files{display:flex;flex-direction:column;gap:3px;font:12.5px 'Atkinson Hyperlegible Mono',monospace}
.files div{display:flex;gap:8px} .files div span:first-child{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.files .p{color:var(--work)} .files .m{color:var(--err)}
.branch{display:flex;align-items:center;gap:8px;font:12.5px 'Atkinson Hyperlegible Mono',monospace;padding:8px 10px;border-radius:6px;background:var(--panel);border:1px solid var(--rule)}
.branch small{margin-left:auto;color:var(--ink3);font-family:'Atkinson Hyperlegible Next',sans-serif}

/* grid */
.gmain{flex:1;display:flex;flex-direction:column;min-width:0;padding:10px 12px 12px;gap:10px}
.gbar{display:flex;align-items:center;gap:12px;height:34px;padding:0 2px}
.gbar h3{margin:0;font-size:15px}
.gbar .muted{color:var(--ink2);font-size:13px}
.lay{display:flex;gap:2px;padding:2px;border-radius:6px;background:color-mix(in srgb,var(--ink) 6%,transparent)}
.lay span{padding:3px 10px;border-radius:4px;font-size:12.5px;color:var(--ink2)}
.lay span.on{background:var(--panel);color:var(--ink);font-weight:800;box-shadow:0 0 0 1px var(--rule)}
.grid{flex:1;display:grid;gap:10px;min-height:0}
.grid.g4{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.grid.g6{grid-template-columns:1fr 1fr 1fr;grid-template-rows:1fr 1fr}
.cell{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--panel);border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.cell.a{border-color:var(--hl-edge)}
.cell.active{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.cell-h{display:flex;align-items:center;gap:8px;height:38px;padding:0 6px 0 12px;border-bottom:1px solid var(--rule);min-width:0}
.cell-h .nm{display:flex;gap:6px;align-items:baseline;min-width:0;white-space:nowrap}
.cell-h .nm b{font-weight:800}
.cell-h .nm span{color:var(--ink3);font-size:12.5px;overflow:hidden;text-overflow:ellipsis}
.cell-h .chip{height:24px;font-size:12px;padding:0 8px}
.cell-h .ib{width:26px;height:26px}
.cell .term{flex:1;padding:10px 12px;font:12px/1.55 'Atkinson Hyperlegible Mono',monospace;min-height:0}
.g6 .cell .term{font-size:11.5px}
.ask{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 12px;border-top:1px solid var(--hl-edge);background:var(--hl-soft);font-size:12.5px;min-width:0}
.ask .q{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ask code{font:12px 'Atkinson Hyperlegible Mono',monospace}

/* overlays */
.scrim{position:absolute;inset:0;background:var(--scrim);display:flex;justify-content:center;align-items:flex-start;padding-top:96px;z-index:5}
.pal{width:640px;background:var(--panel);border:1px solid var(--rule);border-radius:10px;box-shadow:var(--shadow);overflow:hidden}
.pal-in{display:flex;align-items:center;gap:10px;height:52px;padding:0 16px;border-bottom:1px solid var(--rule);font-size:15px}
.pal-in .ph{color:var(--ink3);flex:1}
.pal-in .typed{flex:1}
.pal-in .cur{display:inline-block;width:1.5px;height:18px;background:var(--ink);vertical-align:-3px;margin-left:1px}
.crumbs{display:flex;align-items:center;gap:4px;padding:10px 16px 0;font:12.5px 'Atkinson Hyperlegible Mono',monospace;color:var(--ink2);flex-wrap:wrap}
.crumbs .ttl{font-family:'Atkinson Hyperlegible Next',sans-serif;font-weight:800;color:var(--ink);margin-right:6px}
.crumbs span.seg2{padding:1px 5px;border-radius:4px}
.crumbs span.last{background:var(--hover);color:var(--ink)}
.pal-list{padding:6px;display:flex;flex-direction:column}
.pal-g{padding:8px 10px 4px;font-size:11.5px;font-weight:800;color:var(--ink3)}
.pal-i{display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border-radius:6px}
.pal-i .ic{color:var(--ink3)}
.pal-i .lb{white-space:nowrap}
.pal-i .dt{color:var(--ink3);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.pal-i.on{background:var(--sel)}
.pal-i.on .ic{color:var(--acc)}
.pal-i .tag{font-size:11.5px;color:var(--ink3);border:1px solid var(--rule);border-radius:4px;padding:0 6px}
.pal-f{display:flex;gap:16px;padding:9px 16px;border-top:1px solid var(--rule);font-size:12px;color:var(--ink2);background:var(--hover)}
.pal-f span{display:inline-flex;align-items:center;gap:6px}
.pop{position:absolute;z-index:6;width:400px;background:var(--panel);border:1px solid var(--rule);border-radius:10px;box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:10px}
.pop h6{margin:0;font-size:12px;font-weight:800;color:var(--ink2)}
.opts{display:flex;gap:4px;flex-wrap:wrap}
.opt{display:flex;flex-direction:column;gap:1px;padding:7px 10px;border-radius:6px;border:1px solid var(--rule);font-size:13px;font-weight:700;min-width:70px}
.opt small{font-weight:400;font-size:11.5px;color:var(--ink3)}
.opt.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc);background:var(--sel)}
.opt.cur{position:relative}

/* ---------- page wiring ---------- */
let theme='light', cur=0;
const stage=document.getElementById('stage'), picker=document.getElementById('picker');
picker.innerHTML=SCREENS.map((s,i)=>'<button role="tab" aria-selected="false" data-i="'+i+'"><span>'+(i+1)+'</span>'+s.name+'</button>').join('');
function render(){
  const s=SCREENS[cur];
  stage.innerHTML=s.html();
  document.getElementById('scrTitle').textContent=s.title;
  document.getElementById('scrCount').textContent=(cur+1)+' / '+SCREENS.length;
  document.getElementById('notes').innerHTML=s.notes.map(n=>'<div><b>'+n[0]+(n[2]?' <span class="mock">Mock</span>':'')+'</b><p>'+n[1]+'</p></div>').join('');
  picker.querySelectorAll('button').forEach((b,i)=>b.setAttribute('aria-selected',String(i===cur)));
  fit();
}
function go(i){ cur=(i+SCREENS.length)%SCREENS.length; render(); }
picker.addEventListener('click',e=>{const b=e.target.closest('button'); if(b) go(+b.dataset.i);});
document.getElementById('prev').onclick=()=>go(cur-1);
document.getElementById('next').onclick=()=>go(cur+1);
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight') go(cur+1); else if(e.key==='ArrowLeft') go(cur-1);
  else if(/^[1-8]$/.test(e.key)) go(+e.key-1);
});
document.querySelectorAll('#themeSeg button').forEach(b=>b.onclick=()=>{
  theme=b.dataset.v;
  document.querySelectorAll('#themeSeg button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));
  const a=stage.querySelector('.app'); if(a) a.dataset.mt=theme;
});
const ex=location.hash.slice(1).split('-');
if(ex[0]){ const i=SCREENS.findIndex(s=>s.id===ex[0]); if(i>=0){ theme=ex[1]||'light';
  document.body.style.cssText='padding:0;margin:0;background:#888';
  document.body.innerHTML='<div style="width:1360px;height:840px">'+SCREENS[i].html()+'</div>';
  return; } }
function fit(){
  const a=stage.firstElementChild; if(!a) return;
  const k=Math.min(1,stage.clientWidth/1360);
  a.style.transform='scale('+k+')'; stage.style.height=(840*k)+'px';
}
window.addEventListener('resize',fit);
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(fit);
render();
})();
</script>
